---
lockfileVersion: '9.0'

importers:

  .:
    configDependencies: {}
---
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      local-lib:
        specifier: file:../local-lib
        version: file:../local-lib
      next:
        specifier: 15.1.0
        version: 15.1.0(react@19.0.0)
      react:
        specifier: ^19.0.0
        version: 19.0.0
      ui:
        specifier: workspace:*
        version: link:packages/ui
    optionalDependencies:
      '@scope/opt':
        specifier: ^1.0.0
        version: 1.2.0
    devDependencies:
      typescript:
        specifier: ^5
        version: 5.7.2
      vitest:
        specifier: ^2
        version: 2.1.8

  packages/ui:
    dependencies:
      react:
        specifier: ^19.0.0
        version: 19.0.0

packages:

  '@next/env@15.1.0':
    resolution: {integrity: sha512-aaa}

  '@next/swc-linux-x64-gnu@15.1.0':
    resolution: {integrity: sha512-bbb}
    engines: {node: '>= 10'}
    cpu: [x64]
    os: [linux]

  '@scope/opt@1.2.0':
    resolution: {integrity: sha512-ccc}

  client-only@0.0.1:
    resolution: {integrity: sha512-ddd}

  js-tokens@4.0.0:
    resolution: {integrity: sha512-eee}

  left-pad@1.3.0:
    resolution: {integrity: sha512-lll}

  local-lib@file:../local-lib:
    resolution: {directory: ../local-lib, type: directory}

  next@15.1.0:
    resolution: {integrity: sha512-fff}
    engines: {node: ^18.18.0 || ^19.8.0 || >= 20.0.0}
    hasBin: true
    peerDependencies:
      react: ^18.2.0 || ^19.0.0
      typescript: '>=5'
    peerDependenciesMeta:
      typescript:
        optional: true

  react@18.3.1:
    resolution: {integrity: sha512-r18}

  react@19.0.0:
    resolution: {integrity: sha512-r19}

  styled-jsx@5.1.6:
    resolution: {integrity: sha512-ggg}
    peerDependencies:
      react: '>= 16.8.0 || 17.x.x || ^18.0.0-0 || ^19.0.0-0'

  tinyspy@3.0.2:
    resolution: {integrity: sha512-hhh}
    engines: {node: '>=14.0.0'}

  typescript@5.7.2:
    resolution: {integrity: sha512-iii}
    engines: {node: '>=14.17'}
    hasBin: true

  vitest@2.1.8:
    resolution: {integrity: sha512-jjj}

snapshots:

  '@next/env@15.1.0': {}

  '@next/swc-linux-x64-gnu@15.1.0':
    optional: true

  '@scope/opt@1.2.0':
    dependencies:
      js-tokens: 4.0.0
      react: 18.3.1
    optional: true

  client-only@0.0.1: {}

  js-tokens@4.0.0: {}

  left-pad@1.3.0: {}

  local-lib@file:../local-lib:
    dependencies:
      left-pad: 1.3.0

  next@15.1.0(react@19.0.0):
    dependencies:
      '@next/env': 15.1.0
      react: 19.0.0
      styled-jsx: 5.1.6(react@19.0.0)
    optionalDependencies:
      '@next/swc-linux-x64-gnu': 15.1.0
      typescript: 5.7.2

  react@18.3.1:
    optional: true

  react@19.0.0: {}

  styled-jsx@5.1.6(react@19.0.0):
    dependencies:
      client-only: 0.0.1
      react: 19.0.0

  tinyspy@3.0.2: {}

  typescript@5.7.2: {}

  vitest@2.1.8:
    dependencies:
      js-tokens: 4.0.0
      tinyspy: 3.0.2
