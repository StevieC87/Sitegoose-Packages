lockfileVersion: '6.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      local-lib:
        specifier: file:../local-lib
        version: file:../local-lib
      next:
        specifier: 15.1.0
        version: 15.1.0(react@19.0.0)
      react:
        specifier: ^19.0.0
        version: 19.0.0
      ui:
        specifier: workspace:*
        version: link:packages/ui
    optionalDependencies:
      '@scope/opt':
        specifier: ^1.0.0
        version: 1.2.0
    devDependencies:
      typescript:
        specifier: ^5
        version: 5.7.2
      vitest:
        specifier: ^2
        version: 2.1.8

  packages/ui:
    dependencies:
      react:
        specifier: ^19.0.0
        version: 19.0.0

packages:

  /@next/env@15.1.0:
    resolution: {integrity: sha512-aaa}
    dev: false

  /@next/swc-linux-x64-gnu@15.1.0:
    resolution: {integrity: sha512-bbb}
    engines: {node: '>= 10'}
    cpu: [x64]
    os: [linux]
    requiresBuild: true
    dev: false
    optional: true

  /@scope/opt@1.2.0:
    resolution: {integrity: sha512-ccc}
    dependencies:
      js-tokens: 4.0.0
      react: 18.3.1
    dev: false
    optional: true

  /client-only@0.0.1:
    resolution: {integrity: sha512-ddd}
    dev: false

  /js-tokens@4.0.0:
    resolution: {integrity: sha512-eee}

  /left-pad@1.3.0:
    resolution: {integrity: sha512-lll}
    dev: false

  /next@15.1.0(react@19.0.0):
    resolution: {integrity: sha512-fff}
    engines: {node: ^18.18.0 || ^19.8.0 || >= 20.0.0}
    hasBin: true
    peerDependencies:
      react: ^18.2.0 || ^19.0.0
    dependencies:
      '@next/env': 15.1.0
      react: 19.0.0
      styled-jsx: 5.1.6(react@19.0.0)
    optionalDependencies:
      '@next/swc-linux-x64-gnu': 15.1.0
    dev: false

  /react@18.3.1:
    resolution: {integrity: sha512-r18}
    dev: false
    optional: true

  /react@19.0.0:
    resolution: {integrity: sha512-r19}
    dev: false

  /styled-jsx@5.1.6(react@19.0.0):
    resolution: {integrity: sha512-ggg}
    peerDependencies:
      react: '>= 16.8.0 || 17.x.x || ^18.0.0-0 || ^19.0.0-0'
    dependencies:
      client-only: 0.0.1
      react: 19.0.0
    dev: false

  /tinyspy@3.0.2:
    resolution: {integrity: sha512-hhh}
    engines: {node: '>=14.0.0'}
    dev: true

  /typescript@5.7.2:
    resolution: {integrity: sha512-iii}
    engines: {node: '>=14.17'}
    hasBin: true
    dev: true

  /vitest@2.1.8:
    resolution: {integrity: sha512-jjj}
    dependencies:
      js-tokens: 4.0.0
      tinyspy: 3.0.2
    dev: true

  file:../local-lib:
    resolution: {directory: ../local-lib, type: directory}
    name: local-lib
    version: 1.0.0
    dependencies:
      left-pad: 1.3.0
    dev: false
